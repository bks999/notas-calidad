plugins {
    id 'java'
    id 'checkstyle'                                   // linter
    id 'com.diffplug.spotless' version '6.25.0'       // formatter
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-text:1.9'   // VERSIÓN VULNERABLE (Parte 2)

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
    java {
        googleJavaFormat('1.22.0').aosp()
    }
}

checkstyle {
    toolVersion = '10.17.0'
    maxWarnings = 0
}

test {
    useJUnitPlatform()
}